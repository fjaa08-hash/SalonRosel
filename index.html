<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rosel · Salón de Belleza</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rosel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000; --ink2:#4a4452; --mute:#8b8494; --paper:#fff; --pearl:#faf7fc; --line:#ece6f1;
  --pink:#ff9ed1; --lilac:#d6b6ff; --sky:#9de0f7; --gold:#ffe4a0;
  --holo:linear-gradient(115deg,#ff9ed1 0%,#d6b6ff 36%,#9de0f7 68%,#ffe4a0 100%);
  --holo-soft:linear-gradient(115deg,#ffdcee 0%,#eee0ff 38%,#dcf4fd 68%,#fff2d3 100%);
  --ok:#1c7f55; --warn:#a8480f; --bad:#c2263f;
  --fd:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --fb:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --tab-h:64px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f1ecf5;color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.35;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
input,textarea,select{font:inherit;font-size:16px;color:inherit;user-select:text;-webkit-user-select:text;-webkit-appearance:none;appearance:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none}
button:active:not(:disabled){opacity:.7}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid #000;outline-offset:2px}

#app{position:relative;height:100%;max-width:520px;margin:0 auto;background:#fff;overflow:hidden}
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-top:var(--sat);padding-bottom:calc(var(--tab-h) + var(--sab) + 28px)}
#offline{position:absolute;top:var(--sat);left:0;right:0;z-index:6;background:#000;color:#fff;font-size:13px;text-align:center;padding:6px 12px}

/* Barra inferior */
#tabs{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--sab));padding-bottom:var(--sab);
  background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tab-h);font-size:11.5px;font-weight:500;color:var(--mute);position:relative}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;top:0;left:50%;width:30px;height:3px;margin-left:-15px;border-radius:0 0 4px 4px;background:var(--holo)}
.tab-plus{height:var(--tab-h);display:flex;align-items:flex-start;justify-content:center}
.plus{width:58px;height:58px;border-radius:50%;background:var(--holo);padding:3px;margin-top:-20px}
.plus i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#000;color:#fff}
.plus svg{width:26px;height:26px;stroke-width:2}

/* Encabezados */
.top{display:flex;align-items:center;gap:10px;padding:14px 12px 6px 20px;min-height:64px}
.top h1{font-family:var(--fd);font-weight:700;font-size:36px;letter-spacing:-.01em;line-height:1;flex:1}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ibtn:active{background:var(--pearl)}
h2.sec{font-family:var(--fd);font-size:25px;font-weight:700;padding:24px 20px 4px;display:flex;align-items:baseline;justify-content:space-between}
h2.sec small{font-family:var(--fb);font-size:13.5px;font-weight:500;color:var(--mute)}
.pad{padding:0 20px}
.muted{color:var(--mute)} .small{font-size:13.5px}

/* Inicio */
.brand{display:flex;align-items:center;gap:14px;padding:14px 12px 4px 20px}
.brand img{width:58px;height:58px;border-radius:50%;box-shadow:0 2px 14px rgba(150,80,190,.28)}
.brand .g{flex:1;min-width:0}
.brand .g p{font-size:14px;color:var(--ink2)}
.brand .g h1{font-family:var(--fd);font-size:30px;font-weight:700;line-height:1.05}
.hero{margin:12px 20px 0;border-radius:28px;padding:22px 22px 18px;background:var(--holo-soft);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.75) 50%,transparent 68%);
  transform:translateX(-110%);animation:sweep 1.5s .45s ease-out 1 forwards;pointer-events:none}
@keyframes sweep{to{transform:translateX(110%)}}
.hero .lab{font-size:14.5px;color:var(--ink2)}
.hero .big{font-family:var(--fd);font-weight:700;font-size:60px;line-height:1;margin:6px 0 6px;letter-spacing:-.02em}
.hero .sub{font-size:15px;color:var(--ink2)}
.ratebtn{margin-top:14px;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.7);font-size:13.5px;font-weight:500;position:relative;z-index:1}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px 0}

/* Listas */
.list{padding:0 20px}
.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0;display:block}
.row>svg{color:var(--mute);width:18px;height:18px}
.row .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row .v small{display:block;font-weight:400;font-size:12.5px;color:var(--mute)}
.row .v.warn{color:var(--warn)} .row .v.in{color:var(--ok)} .row .v.out{color:var(--bad)}
.av{width:46px;height:46px;border-radius:50%;background:var(--holo);padding:2px;flex:none}
.av b{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:20px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--holo-soft)}
.pill.warn{background:#fff0d6;color:var(--warn)}
.pill.ok{background:#dff5ea;color:var(--ok)}
.empty{padding:34px 28px;text-align:center;color:var(--ink2)}
.empty img{width:92px;height:92px;border-radius:50%;margin-bottom:12px;box-shadow:0 2px 16px rgba(150,80,190,.25)}
.empty h3{font-family:var(--fd);font-size:26px;font-weight:700;margin-bottom:6px;color:#000}
.empty p{margin-bottom:16px}
.searchbar{margin:6px 20px 4px;position:relative}
.searchbar svg{position:absolute;left:14px;top:50%;margin-top:-10px;width:20px;height:20px;color:var(--mute)}
.searchbar .inp{padding-left:44px;background:var(--pearl);border-color:transparent}

/* Botones y campos */
.btn{height:50px;padding:0 22px;border-radius:999px;background:#000;color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:9px;white-space:nowrap}
.btn svg{width:20px;height:20px}
.btn.ghost{background:#fff;color:#000;box-shadow:inset 0 0 0 1.5px #000}
.btn.soft{background:var(--pearl);color:#000}
.btn.holo{background:var(--holo);color:#000}
.btn.danger{background:#fff;color:var(--bad);box-shadow:inset 0 0 0 1.5px #f0c6cf}
.btn.sm{height:38px;padding:0 16px;font-size:14.5px}
.btn.block{width:100%}
.btn:disabled,.btn.off{opacity:.35;pointer-events:none}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:13.5px;color:var(--ink2);margin:0 0 6px;font-weight:500}
.inp{width:100%;min-width:0;color:#000;height:50px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;outline:none;display:block}
.inp:focus{border-color:#000}
textarea.inp{height:auto;padding:12px 14px;min-height:76px;resize:none}
.picker{width:100%;height:54px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;display:flex;align-items:center;gap:12px;text-align:left;background:#fff}
.picker .ph{color:var(--mute)}
.picker svg:last-child{margin-left:auto;color:var(--mute);width:20px;height:20px}
.seg{display:flex;background:var(--pearl);border-radius:14px;padding:4px;gap:4px;margin:6px 20px 8px}
.seg.in{margin:0 0 12px}
.seg button{flex:1;height:40px;border-radius:11px;font-weight:500;color:var(--ink2)}
.seg button.on{background:#fff;color:#000;font-weight:600;box-shadow:0 1px 5px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14.5px;background:#fff;text-align:left}
.chip.on{border-color:#000;background:#000;color:#fff}
.chip b{font-weight:600} .chip span{color:var(--mute);margin-left:6px}
.chip.dis{opacity:.4;pointer-events:none}
.hint{font-size:13.5px;color:var(--mute);margin:-4px 0 14px}
.sep{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin:16px 0}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.stack{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two .btn{padding:0 12px}

/* Cobro */
.line{padding:12px 0;border-bottom:1px solid var(--line)}
.ln-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.ln-top button{width:32px;height:32px;display:grid;place-items:center;color:var(--mute)}
.ln-bot{display:flex;align-items:center;gap:12px;margin-top:8px}
.step{display:flex;align-items:center;background:var(--pearl);border-radius:12px}
.step button{width:40px;height:38px;display:grid;place-items:center}
.step span{min-width:24px;text-align:center;font-weight:600}
.mini{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.inp.sm{height:38px;width:92px;border-radius:10px;padding:0 10px}
.ln-bot .sub{margin-left:auto;font-variant-numeric:tabular-nums}
.tot{margin:16px 0 4px;padding:16px;border-radius:20px;background:var(--holo-soft)}
.tot .r{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0}
.tot .r.big{font-family:var(--fd);font-size:32px;font-weight:700}
.tot .r.warn{color:var(--warn);font-weight:600}
.tot small{color:var(--ink2)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-weight:600;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:6px;white-space:nowrap;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}
.stats div{background:var(--pearl);border-radius:16px;padding:12px 8px;text-align:center}
.stats b{display:block;font-family:var(--fd);font-size:24px;font-weight:700;line-height:1.1}
.stats span{font-size:12.5px;color:var(--ink2)}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 20px 4px}
.sum3 div{background:var(--pearl);border-radius:16px;padding:12px 10px}
.sum3 span{display:block;font-size:12.5px;color:var(--ink2)}
.sum3 b{font-family:var(--fd);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:0 20px 10px}
.daytitle{padding:16px 20px 2px;font-size:13.5px;color:var(--ink2);font-weight:600}
canvas.inv{width:100%;height:auto;border-radius:18px;border:1px solid var(--line);display:block}

/* Sheets */
#sheets .sheet-wrap{position:fixed;inset:0;z-index:20;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(30,10,45,.4);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:92dvh;background:#fff;border-radius:28px 28px 0 0;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.85,.25,1);display:flex;flex-direction:column;padding-bottom:var(--sab)}
.sheet.tall{height:92dvh}
#sheets .sheet-wrap.in{pointer-events:auto}
.sheet-wrap.in .scrim{opacity:1}
.sheet-wrap.in .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:#ddd5e4;margin:9px auto 2px;flex:none}
.sheet-head{display:flex;align-items:center;padding:6px 12px 8px 20px;flex:none}
.sheet-head h3{font-family:var(--fd);font-size:30px;font-weight:700;flex:1;line-height:1.1}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 22px;flex:1;overscroll-behavior:contain}
.sheet-foot{padding:12px 20px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex:none}
.sheet-foot .btn{flex:1;height:48px}
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--sab) + 18px);transform:translate(-50%,16px);background:#000;color:#fff;padding:12px 18px;
  border-radius:999px;opacity:0;transition:opacity .22s,transform .22s;z-index:60;max-width:88%;font-size:14.5px;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#dlg{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(30,10,45,.45);padding:28px}
#dlg.on{display:flex}
#dlg .box{background:#fff;border-radius:26px;padding:24px 22px 18px;max-width:340px;width:100%}
#dlg h4{font-family:var(--fd);font-size:26px;font-weight:700;margin-bottom:6px}
#dlg p{color:var(--ink2);margin-bottom:18px}
#dlg .acts{display:flex;gap:10px} #dlg .acts .btn{flex:1}
#splash{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;transition:opacity .3s}
#splash img{width:150px;height:150px;border-radius:50%;box-shadow:0 4px 30px rgba(150,80,190,.3)}
#splash.off{opacity:0;pointer-events:none}
.sync{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:12px}
.dot{width:10px;height:10px;border-radius:50%;background:#c9c2d0;flex:none}
.dot.ok{background:#2fbf82} .dot.warn{background:#f0a23a} .dot.bad{background:#e0405a}
.set-sec{padding:6px 0 10px}
.set-sec h3{font-family:var(--fd);font-size:26px;font-weight:700;margin:20px 0 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:521px){#app{box-shadow:0 0 0 1px var(--line),0 10px 50px rgba(120,60,160,.12)}}
</style>
</head>
<body>
<div id="splash"><img src="logo.webp" alt="Rosel"></div>
<div id="app">
  <div id="offline" hidden>Sin conexión: tus cambios se guardan y se sincronizan al volver</div>
  <main id="view"></main>
  <nav id="tabs"></nav>
</div>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="dlg"><div class="box"></div></div>
<input type="file" id="vcf" accept=".vcf,text/vcard,text/x-vcard" hidden>
<input type="file" id="restore" accept=".json,application/json" hidden>
<script>
'use strict';
/* =====================================================================
   ROSEL · Salón de Belleza — app instalable (PWA)
   Para sincronizar entre celulares, pega tu configuración de Firebase
   abajo (o en Ajustes ▸ Sincronización, dentro de la app).
   ===================================================================== */
const FIREBASE_CONFIG = null;   // ej.: {apiKey:"...", authDomain:"...", projectId:"...", appId:"..."}

const LS = 'rosel.v1';
const COLS = ['clients','services','products','payments','expenses'];
const DEF = {
  salonName:'Salón de Belleza Rosel',
  address:'Urb. Aristides Calvanis, Av. principal casa #23, frente al puente que comunica con Las Eugenias',
  pmBank:'Banco de Venezuela', pmPhone:'', pmId:'', pmHolder:'', binanceId:'',
  rate:0, rateDate:'', rateAuto:true, cc:'58', counter:0
};
let S = loadState();
function loadState(){
  let d={}; try{ d=JSON.parse(localStorage.getItem(LS)||'{}') }catch(e){}
  const s={}; COLS.forEach(c=>s[c]=d[c]||{});
  s.settings=Object.assign({},DEF,d.settings||{});
  return s;
}
function save(){ try{ localStorage.setItem(LS,JSON.stringify(S)) }catch(e){ toast('No se pudo guardar en este teléfono') } }

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{ if(typeof v==='number') return isFinite(v)?v:0; const n=parseFloat(String(v||'').replace(',','.')); return isFinite(n)?n:0; };
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const nf=new Intl.NumberFormat('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=n=>'€ '+nf.format(r2(n));
const bsf=n=>'Bs '+nf.format(r2(n));
const pad2=n=>String(n).padStart(2,'0');
const nowLocal=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
const dayStr=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayStr=()=>dayStr(new Date());
const parseD=s=>new Date(s&&s.length<=10?s+'T00:00':s);
const fDate=s=>parseD(s).toLocaleDateString('es-VE',{weekday:'short',day:'numeric',month:'short'});
const fDateLong=s=>parseD(s).toLocaleDateString('es-VE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fTime=s=>parseD(s).toLocaleTimeString('es-VE',{hour:'numeric',minute:'2-digit'});
const fDT=s=>fDate(s)+', '+fTime(s);
const digits=s=>String(s||'').replace(/\D/g,'');
const sum=a=>r2(a.reduce((x,y)=>x+num(y),0));
const rate=()=>num(S.settings.rate);
const paidOf=p=>sum((p.abonos||[]).map(a=>a.amount));
const saldoOf=p=>{const s=r2(num(p.total)-paidOf(p));return s>0.004?s:0};
const conceptOf=p=>(p.items||[]).map(i=>i.qty>1?`${i.name} ×${i.qty}`:i.name).join(', ');
const initials=n=>{const w=String(n||'?').trim().split(/\s+/);return ((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase()};
const visitsOf=id=>Object.values(S.payments).filter(p=>p.clientId===id);
const clone=o=>JSON.parse(JSON.stringify(o));
const byName=(a,b)=>String(a.name).localeCompare(String(b.name),'es');
const invNum=p=>String(p.num||0).padStart(4,'0');

/* ---------- iconos ---------- */
const IC={
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.1-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18.5 14.8c1.7.7 2.7 2.4 3 5.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  tag:'<path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8.5" cy="8.5" r="1.3"/>',
  book:'<path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
  sliders:'<path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="8.5" cy="17" r="2.3"/>',

let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600); }
function buzz(n=8){ try{ navigator.vibrate&&navigator.vibrate(n) }catch(e){} }
function ask(title,msg,ok='Aceptar',danger=false){
  return new Promise(res=>{
    const d=$('#dlg');
    $('.box',d).innerHTML=`<h4>${esc(title)}</h4><p>${esc(msg)}</p><div class="acts"><button class="btn ghost" data-r="0">Cancelar</button><button class="btn ${danger?'danger':''}" data-r="1">${esc(ok)}</button></div>`;
    d.classList.add('on');
    d.onclick=e=>{ const b=e.target.closest('[data-r]'); if(b||e.target===d){ d.classList.remove('on'); res(b?b.dataset.r==='1':false); } };

const SH=[]; let pendingClose=null;
function openSheet(html,opt={}){
  const w=document.createElement('div'); w.className='sheet-wrap';
  w.innerHTML=`<div class="scrim"></div><section class="sheet${opt.tall?' tall':''}" role="dialog" aria-modal="true"><div class="grab"></div>${html}</section>`;
  $('#sheets').appendChild(w);
  history.pushState({s:SH.length+1},'');
  const e={w,sh:$('.sheet',w),refresh:opt.refresh||null,onClose:opt.onClose||null};
  SH.push(e);
  $('.scrim',w).addEventListener('click',closeSheet);
  dragSheet(e);
  requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('in')));
  return e.sh;
}
function closeSheet(){ return new Promise(r=>{ if(!SH.length) return r(); pendingClose=r; history.back(); }); }
function popSheet(){
  const e=SH.pop(); if(!e) return;
  e.w.classList.remove('in'); setTimeout(()=>e.w.remove(),320);
  if(e.onClose) e.onClose();
}
window.addEventListener('popstate',()=>{
  if(SH.length) popSheet();
  if(pendingClose){ const r=pendingClose; pendingClose=null; r(); }
});
function dragSheet(e){
  const sh=e.sh; let y0=null,dy=0;
  sh.addEventListener('touchstart',ev=>{ if(!ev.target.closest('.grab,.sheet-head')) return; y0=ev.touches[0].clientY; dy=0; sh.style.transition='none'; },{passive:true});
  sh.addEventListener('touchmove',ev=>{ if(y0===null) return; dy=Math.max(0,ev.touches[0].clientY-y0); sh.style.transform=`translateY(${dy}px)`; },{passive:true});
  sh.addEventListener('touchend',()=>{ if(y0===null) return; sh.style.transition=''; sh.style.transform=''; const go=dy>90; y0=null; if(go) closeSheet(); });
}
const shHead=(t,extra='')=>`<div class="sheet-head"><h3>${t}</h3>${extra}<button class="ibtn" data-act="close" aria-label="Cerrar">${I('x')}</button></div>`;

const loadedJs={};
function loadScript(src){
  return loadedJs[src]||(loadedJs[src]=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src; s.onload=res;
    s.onerror=()=>{delete loadedJs[src];rej(new Error('No se pudo cargar '+src))}; document.head.appendChild(s);
  }));
}

function waNumber(phone){
  let d=digits(phone); if(!d) return '';
  if(d.startsWith('00')) d=d.slice(2);
  else if(d.startsWith('0')) d=(S.settings.cc||'58')+d.slice(1);
  else if(d.length<=10) d=(S.settings.cc||'58')+d;
  return d;
}

A['pick-contacts']=async()=>{

      await addContacts(r.map(x=>({name:((x.name&&x.name[0])||'').trim(),phone:((x.tel&&x.tel[0])||'').trim()})).filter(x=>x.name||x.phone));
    }catch(e){ if(!e||e.name!=='AbortError') toast('No se pudo abrir tus contactos'); }

async function addContacts(list){
  if(!list||!list.length) return;
  if(list.length>15 && !(await ask('Agregar contactos',`Se agregarán hasta ${list.length} contactos como clientas. ¿Continuar?`,'Agregar'))) return;
  const cb=CF.cb; let added=0, first=null;
  list.forEach(x=>{
    const ph=digits(x.phone), name=x.name||x.phone;
    const ex=Object.values(S.clients).find(c=>(ph.length>=7&&digits(c.phone).slice(-9)===ph.slice(-9))||c.name.toLowerCase()===name.toLowerCase());
    if(ex){ first=first||ex; return; }
    const c={id:uid(),name,phone:x.phone,notes:'',createdAt:Date.now()}; put('clients',c); added++; first=first||c;
  });
  if(CF.sh&&SH.some(e=>e.sh===CF.sh)) await closeSheet();
  buzz(); toast(added?(added===1?'Clienta agregada':`${added} clientas agregadas`):'Esos contactos ya estaban en tu lista');
  softRender(); if(cb&&first) cb(first);
}
function parseVcf(t){
  const out=[];
  t.split(/BEGIN:VCARD/i).slice(1).forEach(b=>{
    let name='',phone='';
    b.replace(/\r?\n[ \t]/g,'').split(/\r?\n/).forEach(l=>{
      const v=l.slice(l.indexOf(':')+1).trim();
      if(/^FN[:;]/i.test(l)){ if(!name) name=v; }
      else if(/^N[:;]/i.test(l)){ if(!name){ const p=v.split(';'); name=((p[1]||'')+' '+(p[0]||'')).trim(); } }
      else if(/^TEL[:;]/i.test(l)){ if(!phone) phone=v; }
    });
    if(name||phone) out.push({name,phone});
  });
  return out;
}
$('#vcf').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const list=parseVcf(await f.text());
  if(!list.length){ toast('No encontré contactos en ese archivo'); return; }
  addContacts(list);
});

function stockMove(items,dir){
  (items||[]).forEach(it=>{ if(it.k!=='p') return; const pr=S.products[it.id]; if(!pr) return;
    put('products',{...pr,stock:Math.max(0,num(pr.stock)+dir*it.qty)}); });

A['cb-save']=()=>{
  const {D,sh,editing,old}=CB;
  if(!D.clientId){ toast('Elige una clienta'); return; }
  if(!D.items.length){ toast('Agrega al menos un servicio o producto'); return; }
  const total=cbTotal(); if(!(total>0)){ toast('El total debe ser mayor a 0'); return; }
  const c=S.clients[D.clientId];
  buzz(15);
  if(editing){
    stockMove(old.items,+1);
    const p={...old,clientId:c.id,clientName:c.name,date:D.date,items:clone(D.items),total,note:D.note.trim()};
    stockMove(p.items,-1); put('payments',p);
    closeSheet().then(()=>{ toast('Cobro actualizado'); softRender(); });
    return;
  }
  let paid=D.mode==='full'?total:Math.min(num(D.abono),total);
  if(D.mode==='abono'&&!(paid>0)){ toast('Escribe el monto del abono'); return; }
  S.settings.counter=num(S.settings.counter)+1; saveSettings();
  const p={id:uid(),num:S.settings.counter,clientId:c.id,clientName:c.name,date:D.date,items:clone(D.items),total,
    abonos:paid>0?[{id:uid(),date:D.date,amount:r2(paid),method:D.method}]:[],method:D.method,note:D.note.trim(),rate:rate(),createdAt:Date.now()};
  stockMove(p.items,-1); put('payments',p);
  softRender();
  CB=null; showInvoice(sh,p);
};

  toast('Buscando tasa…'); const v=await fetchRate();

async function fetchRate(){
  for(const u of ['https://ve.dolarapi.com/v1/euros/oficial','https://ve.dolarapi.com/v1/euros']){
    try{
      const r=await fetch(u,{cache:'no-store'}); if(!r.ok) continue; let j=await r.json();
      if(Array.isArray(j)) j=j.find(x=>/oficial|bcv/i.test((x.fuente||'')+(x.nombre||'')))||j[0];
      const v=num(j&&(j.promedio!=null?j.promedio:(j.venta!=null?j.venta:j.compra)));
      if(v>0) return r2(v);
    }catch(e){}
  }
  return 0;
}
async function autoRate(){
  if(!S.settings.rateAuto||!navigator.onLine||S.settings.rateDate===todayStr()) return;
  const v=await fetchRate(); if(v){ S.settings.rate=v; S.settings.rateDate=todayStr(); saveSettings(); softRender(); }
}

/* ---------- Libro diario ---------- */
function ledger(from,to){
  const out=[];
  Object.values(S.payments).forEach(p=>(p.abonos||[]).forEach(a=>{
    const d=(a.date||'').slice(0,10);
    if(d>=from&&d<=to) out.push({kind:'in',date:a.date,amount:num(a.amount),method:a.method||'',concept:conceptOf(p),who:p.clientName,pid:p.id});
  }));
  Object.values(S.expenses).forEach(x=>{
    const d=(x.date||'').slice(0,10);
    if(d>=from&&d<=to) out.push({kind:'out',date:x.date,amount:num(x.amount),method:x.method||'',concept:x.concept,who:'',eid:x.id});
  });
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
function presetRange(p){
  const t=new Date(), to=dayStr(t); let f=to;
  if(p==='semana'){ const d=new Date(t); d.setDate(d.getDate()-6); f=dayStr(d); }
  if(p==='mes') f=to.slice(0,8)+'01';
  if(p==='todo') f='2000-01-01';
  return [f,to];
}
V.diario=()=>{
  const {from,to,preset}=UI.dr; const ent=ledger(from,to);
  const inn=sum(ent.filter(e=>e.kind==='in').map(e=>e.amount)), out=sum(ent.filter(e=>e.kind==='out').map(e=>e.amount));
  let day='', rows='';
  ent.forEach(e=>{
    const d=e.date.slice(0,10);
    if(d!==day){ day=d; rows+=`<div class="daytitle">${esc(fDateLong(d))}</div>`; }
    const isIn=e.kind==='in';
    rows+=`<button class="row" data-act="${isIn?'pay':'exp'}" data-id="${isIn?e.pid:e.eid}" style="padding-left:20px;padding-right:20px">
      <span class="main"><span class="t">${esc(e.concept||'Sin concepto')}</span><span class="s">${esc(fTime(e.date))}${e.who?' · '+esc(e.who):''}${e.method?' · '+esc(e.method):''}</span></span>
      <span class="v ${isIn?'in':'out'}">${isIn?'+':'−'} ${eur(e.amount)}</span></button>`;
  });
  const P=(id,l)=>`<button class="chip ${preset===id?'on':''}" data-act="dr" data-p="${id}">${l}</button>`;
  return `<div class="top"><h1>Libro diario</h1><button class="ibtn" data-act="xls" aria-label="Exportar a Excel">${I('sheet')}</button></div>
  <div class="pad chips" style="padding-bottom:10px">${P('hoy','Hoy')}${P('semana','7 días')}${P('mes','Este mes')}${P('todo','Todo')}</div>
  <div class="dates"><label class="field" style="margin:0"><span>Desde</span><input class="inp" type="date" value="${from}" data-ch="drdate" data-w="from"></label><label class="field" style="margin:0"><span>Hasta</span><input class="inp" type="date" value="${to}" data-ch="drdate" data-w="to"></label></div>
  <div class="sum3"><div><span>Ingresos</span><b style="color:var(--ok)">${eur(inn)}</b></div><div><span>Egresos</span><b style="color:var(--bad)">${eur(out)}</b></div><div><span>Balance</span><b>${eur(inn-out)}</b></div></div>
  <div class="pad" style="padding-top:12px"><button class="btn ghost block" data-act="exp-new">${I('plus')} Registrar gasto</button></div>

async function exportExcel(from,to){
  const ent=ledger(from,to).reverse();
  const diario=[['Fecha','Hora','Tipo','Concepto','Clienta','Método','Ingreso (€)','Egreso (€)']];
  ent.forEach(e=>diario.push([e.date.slice(0,10),fTime(e.date),e.kind==='in'?'Ingreso':'Egreso',e.concept||'',e.who||'',e.method||'',e.kind==='in'?e.amount:'',e.kind==='out'?e.amount:'']));
  const inn=sum(ent.filter(e=>e.kind==='in').map(e=>e.amount)), out=sum(ent.filter(e=>e.kind==='out').map(e=>e.amount));
  diario.push([],['','','','','','Totales',inn,out],['','','','','','Balance',r2(inn-out)]);
  const pagos=[['Fecha','Recibo','Clienta','Servicios y productos','Total (€)','Pagado (€)','Saldo (€)']];
  Object.values(S.payments).filter(p=>p.date.slice(0,10)>=from&&p.date.slice(0,10)<=to).sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(p=>pagos.push([p.date.replace('T',' '),invNum(p),p.clientName,conceptOf(p),p.total,paidOf(p),saldoOf(p)]));
  const cli=[['Clienta','Teléfono','Visitas','Total pagado (€)']];
  Object.values(S.clients).sort(byName).forEach(c=>{ const v=visitsOf(c.id); cli.push([c.name,c.phone||'',v.length,sum(v.map(paidOf))]); });
  const inv=[['Producto','Precio (€)','Existencia']]; Object.values(S.products).sort(byName).forEach(p=>inv.push([p.name,p.price,num(p.stock)]));
  const name=`Rosel-diario-${from}_a_${to}`;
  toast('Preparando Excel…');
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb=XLSX.utils.book_new();
    const add=(rows,n,w)=>{ const ws=XLSX.utils.aoa_to_sheet(rows); ws['!cols']=w.map(x=>({wch:x})); XLSX.utils.book_append_sheet(wb,ws,n); };
    add(diario,'Libro diario',[12,10,10,38,22,16,13,13]); add(pagos,'Cobros',[18,9,22,44,11,11,11]); add(cli,'Clientas',[26,18,9,16]); add(inv,'Inventario',[30,11,11]);
    XLSX.writeFile(wb,name+'.xlsx'); toast('Excel descargado');
  }catch(e){
    const csv='\ufeff'+diario.map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    saveBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),name+'.csv'); toast('Sin internet para Excel: descargué un CSV que también abre en Excel');
  }
}

  const p=S.payments[d.id]; const blob=await invBlob(p); const file=new File([blob],`Rosel-recibo-${invNum(p)}.png`,{type:'image/png'});
  const c=S.clients[p.clientId];
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],text:invText(p)}); return; }catch(e){ if(e&&e.name==='AbortError') return; }
  }
  saveBlob(blob,file.name); toast('Imagen guardada: adjúntala en el chat de WhatsApp');
  setTimeout(()=>window.open(waLink(c&&c.phone,invText(p)),'_blank'),700);
};
A['inv-txt']=d=>{ const p=S.payments[d.id], c=S.clients[p.clientId]; window.open(waLink(c&&c.phone,invText(p)),'_blank'); };
A['inv-dl']=async d=>{ const p=S.payments[d.id]; saveBlob(await invBlob(p),`Rosel-recibo-${invNum(p)}.png`); toast('Imagen guardada'); };
A['inv-copy']=async d=>{ const p=S.payments[d.id]; const t=pmText(saldoOf(p),p.rate||rate());
  try{ await navigator.clipboard.writeText(t); }catch(e){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch(_){} a.remove(); }
  buzz(); toast('Datos copiados'); };

/* ---------- Sincronización en tiempo real (Firebase) ---------- */
const Cloud={db:null,auth:null,user:null,status:'off',err:'',unsubs:[]};
function parseCfg(t){
  if(!t) return null; const o={}; String(t).replace(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g,(m,k,v)=>{ o[k]=v; return m; });
  return o.apiKey&&o.projectId?o:null;
}
const getFbCfg=()=>FIREBASE_CONFIG||parseCfg(localStorage.getItem('rosel.fbcfg'));
function syncHTML(){
  const map={off:['','Sin conectar. Cada teléfono guarda sus datos por separado.'],connecting:['warn','Conectando…'],ok:['ok','Sincronizado en tiempo real'],
    offline:['warn','Sin internet: se sincronizará al volver'],auth:['bad','Inicia sesión para leer y guardar los datos'],error:['bad','Error: '+Cloud.err]};
  const [c,t]=map[Cloud.status]||map.off;
  return `<div class="sync"><span class="dot ${c}"></span><span>${esc(t)}</span></div>
    ${Cloud.status==='auth'?`<button class="btn block" style="margin-bottom:12px" data-act="cloud-login">Entrar con Google</button>`:''}
    ${Cloud.db&&Cloud.status==='ok'?`<button class="btn soft block" style="margin-bottom:12px" data-act="cloud-push">Subir los datos de este teléfono</button>`:''}`;
}
function setSync(st,err){ Cloud.status=st; Cloud.err=err||''; if(UI.tab==='ajustes'){ const b=$('#syncbox'); if(b) b.innerHTML=syncHTML(); } }
function cloudErr(e){
  const code=(e&&e.code)||''; if(code==='permission-denied') setSync(Cloud.user?'error':'auth',Cloud.user?'sin permiso, revisa las reglas de Firestore':'');
  else if(code==='unavailable') setSync('offline'); else setSync('error',(e&&e.message)||'desconocido');
}
function cloudSet(col,o){ if(Cloud.db) Cloud.db.collection(col).doc(o.id).set(clean(o)).catch(cloudErr); }
function cloudDel(col,id){ if(Cloud.db) Cloud.db.collection(col).doc(id).delete().catch(cloudErr); }
function cloudSettings(){ if(Cloud.db) Cloud.db.collection('meta').doc('settings').set(clean(S.settings)).catch(cloudErr); }
async function cloudInit(){
  const cfg=getFbCfg(); if(!cfg){ setSync('off'); return; }
  if(!navigator.onLine&&!window.firebase){ setSync('offline'); return; }
  try{
    setSync('connecting');
    const B='https://www.gstatic.com/firebasejs/10.12.5/';
    await loadScript(B+'firebase-app-compat.js');
    await Promise.all([loadScript(B+'firebase-firestore-compat.js'),loadScript(B+'firebase-auth-compat.js')]);
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    Cloud.db=firebase.firestore(); Cloud.auth=firebase.auth();
    try{ await Cloud.db.enablePersistence({synchronizeTabs:true}); }catch(e){}
    Cloud.auth.onAuthStateChanged(u=>{ Cloud.user=u; if(!u) Cloud.auth.signInAnonymously().catch(cloudErr); else cloudAttach(); });
  }catch(e){ setSync(navigator.onLine?'error':'offline',e.message); }
}
function cloudDetach(){ Cloud.unsubs.forEach(u=>{ try{u()}catch(e){} }); Cloud.unsubs=[]; }
function cloudAttach(){
  cloudDetach();
  COLS.forEach(col=>{
    Cloud.unsubs.push(Cloud.db.collection(col).onSnapshot(snap=>{
      const key='rosel.seed.'+col, seeded=!!localStorage.getItem(key), cache=snap.metadata.fromCache;
      if(cache&&(!seeded||snap.empty)) return;
      const m={}; snap.forEach(d=>{ m[d.id]=d.data(); });
      if(!seeded&&!cache){ Object.values(S[col]).forEach(o=>{ if(!m[o.id]){ m[o.id]=o; cloudSet(col,o); } }); localStorage.setItem(key,'1'); }
      S[col]=m; save(); setSync(cache?'offline':'ok'); softRender();
    },cloudErr));
  });
  Cloud.unsubs.push(Cloud.db.collection('meta').doc('settings').onSnapshot(doc=>{
    const cache=doc.metadata.fromCache; if(cache&&!doc.exists) return;
    if(doc.exists){ S.settings=Object.assign({},DEF,doc.data()); save(); softRender(); }
    else if(!cache) cloudSettings();
  },cloudErr));
}
A['cloud-save']=()=>{
  const cfg=parseCfg($('#fbcfg').value); if(!cfg){ toast('No encontré apiKey y projectId en lo que pegaste'); return; }
  localStorage.setItem('rosel.fbcfg',$('#fbcfg').value.trim()); toast('Conectando…'); setTimeout(()=>location.reload(),600);
};
A['cloud-off']=async()=>{
  if(await ask('Desconectar','Este teléfono dejará de sincronizar. Sus datos se conservan.','Desconectar')){
    localStorage.removeItem('rosel.fbcfg'); COLS.forEach(c=>localStorage.removeItem('rosel.seed.'+c)); location.reload();
  }
};
A['cloud-login']=async()=>{
  const pr=new firebase.auth.GoogleAuthProvider();
  try{ await Cloud.auth.signInWithPopup(pr); }catch(e){ try{ await Cloud.auth.signInWithRedirect(pr); }catch(er){ toast('No se pudo iniciar sesión'); } }
};
A['cloud-push']=()=>{ COLS.forEach(c=>Object.values(S[c]).forEach(o=>cloudSet(c,o))); cloudSettings(); toast('Datos subidos a la nube'); };

/* ---------- Arranque ---------- */
function netBanner(){ $('#offline').hidden=navigator.onLine; }
window.addEventListener('online',()=>{ netBanner(); autoRate(); if(!Cloud.db&&getFbCfg()) cloudInit(); });
window.addEventListener('offline',netBanner);
document.addEventListener('contextmenu',e=>{ if(!e.target.closest('input,textarea')) e.preventDefault(); });
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
history.replaceState({s:0},'');
render(); netBanner();
setTimeout(()=>{ const s=$('#splash'); s.classList.add('off'); setTimeout(()=>s.remove(),400); },450);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
cloudInit(); autoRate();
</script>
